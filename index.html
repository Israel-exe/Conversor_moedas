<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moedas Web</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

   <div class="container">
        <h1>Conversor de Moedas</h1>
        <p>Esta é a versão com taxas de câmbio fixas.</p>

        <form id="conversor-form">
            <label for="valor">Valor a ser convertido:</label>
            <input type="number" id="valor" placeholder="Ex: 100" required step="0.01">        
            <label for="moeda-origem">De:</label>
            <select id="moeda-origem">
                <option value="BRL">Real Brasileiro (BRL)</option>
                <option value="USD">Dólar Americano (USD)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="GBP">Libra esterlina (GBP)</option>
            </select>

            <label for="moeda-destino">Para:</label>
            <select id="moeda-destino">
                <option value="USD">Dólar Americano (USD)</option>
                <option value="BRL">Real Brasileiro (BRL)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="GBP">Libra esterlina (GBP)</option>
            </select>

            <button type="submit" id="btn-converter">Converter</button>
        </form>
        
        <div class="resultado-box" id="resultado-container">
            <p id="resultado-texto">Insira um valor e clique em converter.</p>
        </div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
